name: MVP_1 validation

on:
  push:
    paths:
      - "MVP_1/**"
      - ".github/workflows/mvp1-tests.yml"
  pull_request:
    paths:
      - "MVP_1/**"
      - ".github/workflows/mvp1-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: MVP_1/pyproject.toml

      - name: Install MVP and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./MVP_1[dev]"

      - name: Run complete MVP test suite
        run: python -m pytest MVP_1/tests

      - name: Run governed Clause 04 acceptance demonstration
        run: python -m scripts.run_agentic_clause04_demo